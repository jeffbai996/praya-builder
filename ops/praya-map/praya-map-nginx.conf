worker_processes 1;
pid /home/jbai/.local/share/praya-map/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json webmanifest;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/webp webp;
        image/x-icon ico;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /home/jbai/.local/share/praya-map/tmp;
    proxy_temp_path /home/jbai/.local/share/praya-map/tmp;
    fastcgi_temp_path /home/jbai/.local/share/praya-map/tmp;
    uwsgi_temp_path /home/jbai/.local/share/praya-map/tmp;
    scgi_temp_path /home/jbai/.local/share/praya-map/tmp;
    server {
        listen 127.0.0.1:18100;
        root /home/jbai/minecraft/praya/bluemap/web;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        location = /index.html {
            sub_filter '</head>' '<script defer src="/map-context.js"></script></head>';
            sub_filter_once on;
        }
        location = /map-context.js {
            alias /home/jbai/.local/share/praya-map/map-context.js;
        }
        location = /map-status.json {
            proxy_pass http://127.0.0.1:5009/api/status;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
        }
        location ~ /\. { return 404; }
        location ~* (\.php$|\.bak|\.before-) { return 404; }
        location ~ ^/maps/[^/]+/live/players.json$ {
            proxy_pass http://127.0.0.1:8100;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @no_players;
        }
        location @no_players {
            default_type application/json;
            return 200 '{}';
        }
        location ~ ^/maps/[^/]+/live/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @saved_live;
        }
        location @saved_live { try_files $uri =404; }
        location /maps/ {
            gzip_static always;
            location ~ ^/maps/[^/]+/tiles/ {
                gzip_static always;
                error_page 404 = @empty_tile;
            }
        }
        location @empty_tile { return 204; }
    }
}
