# Praya Builder Configuration

# Provider selection. Supported: gemini, none.
ai:
  provider: "gemini"

# Credentials are resolved in this order and the key itself is never logged:
#   1. GEMINI_API_KEY in the server process environment (recommended)
#   2. GEMINI_API_KEY_FILE in the environment (path to a file containing only the key)
#   3. gemini.api-key-file below (relative paths resolve against this plugin's data folder)
#   4. gemini.api-key inline below (deprecated; logs a warning)
gemini:
  api-key-file: ""
  api-key: "YOUR_API_KEY_HERE"
  model: "gemini-2.5-flash"

# Generation limits (blocks)
limits:
  max-width: 48
  max-height: 64
  max-depth: 48
  # Bounds work per build; it is not a model quality or latency guarantee.
  max-blocks: 10000

# Rate limiting
rate-limit:
  cooldown-seconds: 30

# Block palette — controls which blocks the AI can use
palette:
  structural:
    - minecraft:white_concrete
    - minecraft:light_gray_concrete
    - minecraft:gray_concrete
    - minecraft:quartz_block
    - minecraft:smooth_quartz
    - minecraft:stone_bricks
    - minecraft:polished_andesite
  glass:
    - minecraft:glass
    - minecraft:light_gray_stained_glass
    - minecraft:light_blue_stained_glass
  accent:
    - minecraft:dark_oak_planks
    - minecraft:iron_bars
    - minecraft:sea_lantern
    - minecraft:glowstone
  ground:
    - minecraft:smooth_stone
    - minecraft:gray_concrete
    - minecraft:stone_brick_slab
